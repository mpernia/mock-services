name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Conan
        run: |
          pip install conan
          conan --version
          conan profile detect

      - name: Build and package
        run: make release

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist/mock-services-${{ github.ref_name }}-linux-x86_64.tar.gz

  windows-i686:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja
            python
            git

      - name: Install Conan & detect profile
        run: |
          pacman -S --noconfirm mingw-w64-i686-python-pip
          python -m pip install conan
          conan profile detect

      - name: Build
        run: |
          python -c "from conans.conan import run; import sys; sys.exit(run())" install . \
            --build=missing \
            -o "&:with_sftp=True"
          cmake --preset conan-default -DMOCK_SERVICES_ENABLE_SFTP=ON
          cmake --build --preset conan-release

      - name: Package
        shell: msys2 {0}
        run: |
          A_FILE=$(find . -name "libmock-services.a" -not -path "./dist/*" | head -1)
          if [ -z "$A_FILE" ]; then
            A_FILE="build/Release/libmock-services.a"
            [ ! -f "$A_FILE" ] && A_FILE="build/libmock-services.a"
            [ ! -f "$A_FILE" ] && A_FILE="$(find build -name '*.a' -type f | head -1)"
          fi
          A_DIR=$(dirname "$A_FILE")
          GEN_DIR=$(find . -path "*/generators/pugixml-*-data.cmake" -exec dirname {} \; | head -1)
          echo "Library: $A_FILE | Generators: $GEN_DIR"
          mkdir -p dist/mock-services/lib dist/mock-services/include
          cp "$A_FILE" dist/mock-services/lib/
          strip --strip-debug dist/mock-services/lib/libmock-services.a
          cp -r include/mock-services dist/mock-services/include/
          # Bundle pugixml (headers + static lib)
          PUGIXML_DIR=$(grep -h '^set(pugixml_PACKAGE_FOLDER_RELEASE' \
            "$GEN_DIR"/pugixml-*-data.cmake 2>/dev/null \
            | head -1 | sed 's/.*"\(.*\)")$/\1/')
          if [ -n "$PUGIXML_DIR" ]; then
            cp -a "$PUGIXML_DIR/include/"* dist/mock-services/include/
            cp -a "$PUGIXML_DIR/lib/"* dist/mock-services/lib/
            strip --strip-debug dist/mock-services/lib/libpugixml.a 2>/dev/null || true
          fi
          # Bundle cpp-httplib headers (header-only)
          HTTPLIB_DIR=$(grep -h '^set(cpp-httplib_PACKAGE_FOLDER_RELEASE' \
            "$GEN_DIR"/httplib-*-data.cmake 2>/dev/null \
            | head -1 | sed 's/.*"\(.*\)")$/\1/')
          if [ -n "$HTTPLIB_DIR" ]; then
            cp -a "$HTTPLIB_DIR/include/"* dist/mock-services/include/
          fi
          cp LICENSE README.md dist/mock-services/
          cd dist && zip -r mock-services-${{ github.ref_name }}-win32.zip mock-services/

      - name: Upload release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ github.ref_name }} \
            dist/mock-services-${{ github.ref_name }}-win32.zip

  create-release:
    runs-on: ubuntu-24.04
    needs: [linux-x86_64, windows-i686]
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes
